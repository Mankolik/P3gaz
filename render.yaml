services:
  - type: web
    name: p3gaz
    runtime: node
    plan: starter
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
